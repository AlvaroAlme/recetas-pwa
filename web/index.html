<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Recetas con lo que tengas en la nevera.">
    <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#18130e" media="(prefers-color-scheme: dark)">

          </li>
          <li>
            <a href="/recetas">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20M9 7c0-1 1-1.5 1-2.5M13 7c0-1 1-1.5 1-2.5"/></svg>
              <span>Recetas</span>
            </a>
          </li>
          <li>
            <a href="/semana">

        <main id="contenido" class="pantalla" tabindex="-1">
          <div class="pantalla__contenido" id="pantalla">
          </div>
        </main>

        <div class="pie" id="pie" hidden>
          <div class="pie__interior" id="pie-interior">
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/js/app.js"></script>
