<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Controla lo que hay en tu nevera, despensa y congelador, y no tires comida.">
    <meta name="theme-color" content="#f6ead2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1822" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/iconos/icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Stockpot">
    <link rel="preload" href="/fuentes/fraunces.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <!-- La animación del avatar vivo de Perfil (blobatar, D-52). -->
    <link rel="stylesheet" href="/vendor/blobatar/motion.css">
    <title>Stockpot</title>
  </head>
  <body>
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    <div class="app">
      <nav class="navegacion" aria-label="Principal">
        <!-- La marca, solo en la barra lateral del escritorio (en el móvil no cabe). -->
        <p class="marca">
          <img class="marca__icono" src="/iconos/icono.svg" alt="" width="40" height="40">
          <span class="marca__nombre">Stockpot</span>
        </p>
        <ul>
          <li>
            <a href="/">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 9.5h14M8.5 5.5v1.5M8.5 12.5v3"/></svg>
              <span>Inventario</span>
            </a>
          </li>
          <li>
            <a href="/lista">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5l1.5 1.5L8 5.5M4 12.5l1.5 1.5L8 11.5M4.5 18.5h3M11 7h9M11 13h9M11 19h9"/></svg>
              <span>Lista</span>
            </a>
          </li>
          <li>
            <a href="/recetas">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20M9 7c0-1 1-1.5 1-2.5M13 7c0-1 1-1.5 1-2.5"/></svg>
              <span>Recetas</span>
            </a>
          </li>
          <li>
            <a href="/semana">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
              <span>Semana</span>
            </a>
          </li>
        </ul>
        <!-- El Ayudante, fuera de la barra: botón redondo a la derecha (D-59).
             Sigue dentro de .navegacion: el router le pone aria-current igual. -->
        <a class="navegacion__ayudante" href="/ayudante">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h14a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-8l-4.5 3.5V17H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke-width="2.6"/></svg>
          <span>Ayudante</span>
        </a>
      </nav>

      <div class="pagina">
        <header class="cabecera">
            <div class="cabecera__interior">
            <div class="cabecera__lado" id="atras-cabecera"></div>
            <h1 class="cabecera__titulo" id="titulo">Stockpot</h1>
            <div class="cabecera__lado" id="accion-cabecera"></div>
          </div>
        </header>

        <div id="franja-conexion" role="status"></div>

        <main id="contenido" class="pantalla" tabindex="-1">
          <div class="pantalla__contenido" id="pantalla">
          </div>
        </main>

        <!-- Los botones de la pantalla (Guardar, + Producto…). Con nombre, el
             lector de pantallas lo ve como una zona más (axe, "region"). -->
        <section class="pie" id="pie" aria-label="Acciones" hidden>
          <div class="pie__interior" id="pie-interior">
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
