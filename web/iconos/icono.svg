<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Vigía: fondo verde pino a sangre (iOS y Android redondean las esquinas). -->
  <rect width="512" height="512" fill="#1d5e47"/>
  <!-- Ojo y hoja a la vez: la almendra crema, con su rabito. Todo dentro del
       80 % central, la zona segura de los iconos "maskable". -->
  <path d="M96 256 Q256 76 416 256 Q256 436 96 256 Z" fill="#f6f5f0"/>
  <path d="M408 250 L440 222" stroke="#f6f5f0" stroke-width="22" stroke-linecap="round"/>
  <!-- La pupila: la luz del vigía, en azafrán. -->
  <circle cx="256" cy="256" r="58" fill="#f2c14e"/>
  <circle cx="256" cy="256" r="24" fill="#1d5e47"/>
</svg>
